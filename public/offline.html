<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · StudyOS</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0f; color: #e5e7eb; }
        .card { background: #17171d; border-color: #26262e; }
        .muted { color: #9ca3af; }
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px 24px;
        background: #ffffff;
      }
      .icon { font-size: 40px; line-height: 1; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { margin: 6px 0; font-size: 14px; line-height: 1.6; }
      .muted { color: #6b7280; }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>현재 오프라인 상태입니다</h1>
      <p class="muted">AI 기능은 인터넷 연결 후 사용할 수 있습니다.</p>
      <p class="muted">You're offline. AI features are available once you reconnect.</p>
      <button type="button" onclick="location.reload()">다시 시도 · Retry</button>
    </div>
  </body>
</html>
